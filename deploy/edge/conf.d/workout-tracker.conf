# ============================================================
# workout-tracker — три поддомена
# Прокси на порты, которые публикует docker-compose.server.yml (только 127.0.0.1):
#   сайт 8080, API 8081, файлы 8082
# ⚠️ Путь к сертификату проверьте: ls /etc/letsencrypt/live/
#    wildcard *.abm-order.ru покрывает workout-tracker.abm-order.ru,
#    но НЕ покрывает api./storage. — им нужны SAN в сертификате (certbot --expand).
# ============================================================

server {
    listen 80;
    server_name workout-tracker.abm-order.ru api.workout-tracker.abm-order.ru storage.workout-tracker.abm-order.ru;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Сайт + PWA
server {
    listen 443 ssl;
    server_name workout-tracker.abm-order.ru;

    ssl_certificate     /etc/letsencrypt/live/abm-order.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abm-order.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # сюда же идёт загрузка файлов через прокси сайта — видео бывают крупные
    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}

# API
server {
    listen 443 ssl;
    server_name api.workout-tracker.abm-order.ru;

    ssl_certificate     /etc/letsencrypt/live/abm-order.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abm-order.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Файлы упражнений
server {
    listen 443 ssl;
    server_name storage.workout-tracker.abm-order.ru;

    ssl_certificate     /etc/letsencrypt/live/abm-order.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abm-order.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 200m;

    location / {
        proxy_pass http://127.0.0.1:8082;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # видео — частями (Range)
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_buffering off;
    }
}
