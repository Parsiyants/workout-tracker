# ============================================================
# abm_app — abm-order.ru и api.abm-order.ru
# Прокси идёт на 127.0.0.1:<порт>, которые публикует compose abm_app:
#   фронтенд 3005, бэкенд 8000
#
# WebSocket живёт на /api/v1/ws (НЕ на /ws):
#   браузер  → wss://abm-order.ru/api/v1/ws
#   nginx    → http://127.0.0.1:8000/api/v1/ws (с Upgrade/Connection)
#
# ⚠️ Путь к сертификату проверьте: ls /etc/letsencrypt/live/
# ============================================================

server {
    listen 80 default_server;
    server_name abm-order.ru www.abm-order.ru api.abm-order.ru _;

    # продление сертификатов без остановки
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# www → без www
server {
    listen 443 ssl;
    server_name www.abm-order.ru;

    ssl_certificate     /etc/letsencrypt/live/abm-order.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abm-order.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://abm-order.ru$request_uri;
}

# Основной домен
server {
    listen 443 ssl;
    server_name abm-order.ru;

    ssl_certificate     /etc/letsencrypt/live/abm-order.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abm-order.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    # ─── WebSocket ──────────────────────────────────────────
    # Бэкенд отдаёт WS по /api/v1/ws (роутер websocket: prefix "/api" + "/v1/ws").
    # Префикс /api/v1/ws длиннее, чем /api/v1/, поэтому nginx берёт именно этот
    # блок и заголовки Upgrade не теряются.
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ─── REST API ──────────────────────────────────────────
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # ─── Фронтенд ──────────────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API-поддомен
server {
    listen 443 ssl;
    server_name api.abm-order.ru;

    ssl_certificate     /etc/letsencrypt/live/abm-order.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abm-order.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 50m;

    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Запрос по IP (без домена) — как раньше: показываем фронтенд abm
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/letsencrypt/live/abm-order.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/abm-order.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # без этого WS по IP тоже не поднимется
    location /api/v1/ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:3005;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
