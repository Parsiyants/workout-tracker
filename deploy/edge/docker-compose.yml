# Общий входной nginx для всех проектов на VPS.
# Живёт отдельно от проектов: /root/edge
#
# Запуск:  docker compose -f /root/edge/docker-compose.yml up -d
# Логи:    docker compose -f /root/edge/docker-compose.yml logs -f
#
# network_mode: host — nginx слушает 80/443 напрямую на хосте и ходит к бэкендам
# по 127.0.0.1:<порт>, поэтому проектам не нужны общие docker-сети.

name: edge

services:
  nginx:
    image: nginx:alpine
    container_name: edge_nginx
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./conf.d:/etc/nginx/conf.d:ro
      # сертификаты (выпущенные certbot на хосте) — только чтение
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # сюда certbot складывает challenge-файлы при продлении/выпуске
      - ./certbot/www:/var/www/certbot:ro
      - ./logs:/var/log/nginx
